<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seri Okuyucu</title>
<style>
:root{--bg:#101614;--surface:#18211e;--ink:#e6ece9;--muted:#9aa9a3;--line:#2c3a35;--accent:#3fb6a0;--ok:#62c88a;--warn:#e0b04a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:0 max(10px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(8px,env(safe-area-inset-top)) 0 6px;border-bottom:1px solid var(--line)}
.cam{position:relative;background:#000;border-radius:10px;overflow:hidden;max-width:560px;margin:0 auto;height:118px}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.frame{position:absolute;left:4%;right:4%;top:20%;bottom:20%;border:3px solid var(--accent);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.5);pointer-events:none}
.frame.hit{border-color:var(--ok)}
.row{display:flex;gap:6px;align-items:center;margin:6px auto 0;max-width:560px}
button{font:600 14px inherit;font-family:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 10px;border-radius:8px;flex:1 1 auto}
button.primary{background:var(--accent);color:#06201b;border-color:var(--accent)}
#msg{max-width:560px;margin:6px auto 0;padding:6px 10px;border-radius:8px;background:var(--surface);color:var(--muted);font-size:14px}
#msg.ok{color:var(--ok)}
#msg.warn{color:var(--warn)}
.count{flex:0 0 auto;font-size:22px;font-weight:700;min-width:44px;text-align:center}
#zlab{flex:0 0 auto;color:var(--muted);font-size:13px;min-width:72px;text-align:center}
.list{max-width:560px;margin:0 auto}
@media (orientation:landscape){.cam,.row,#msg,.list{max-width:900px}.cam{height:108px}}
#msg a{color:var(--accent);font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-family:ui-monospace,Menlo,monospace;font-size:15px;word-break:break-all}
.item button{flex:0 0 auto;padding:6px 10px;font-size:14px}
</style>
</head>
<body>
<div id="top">
<div class="cam" id="cam"><video id="v" playsinline muted></video><div class="frame" id="f"></div></div>
<div id="msg">Kamerayı başlatmak için "Başlat"a bas.</div>
<div class="row"><button class="primary" id="start">Başlat</button><button id="stop">Durdur</button><button id="zout">Zoom −</button><button id="zin">Zoom +</button><span id="zlab">2.0x</span></div>
<div class="row"><span class="count" id="count">0</span><button class="primary" id="copy">Listeyi kopyala</button><button id="clear">Temizle</button></div>
</div>
<div class="list" id="list"></div>
<script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.11.0/dist/inlined/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function(){
'use strict';
var KEY='okuyucu_liste_v1';
var items=[];try{items=JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){}
var v=document.getElementById('v'),fr=document.getElementById('f'),msg=document.getElementById('msg');
var zoom=2,hwZoom=false,dz=1,stream=null,timer=null,busy=false,running=false,last='',lastAt=0,det=null,reader=null;
async function applyZoom(){
  dz=1;hwZoom=false;
  var tr=stream&&stream.getVideoTracks()[0],cp={};
  try{cp=tr&&tr.getCapabilities?tr.getCapabilities():{};}catch(e){}
  if(cp.zoom&&cp.zoom.max){
    var z=Math.max(cp.zoom.min||1,Math.min(cp.zoom.max,zoom));
    try{await tr.applyConstraints({advanced:[{zoom:z}]});hwZoom=true;}catch(e2){hwZoom=false;}
  }
  if(!hwZoom){dz=zoom;}
  v.style.transform='scale('+dz+')';
  document.getElementById('zlab').textContent=zoom.toFixed(1)+'x'+(hwZoom?' (kamera)':(zoom>1?' (dijital)':''));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}}
function say(t,c){msg.textContent=t;msg.className=c||'';}
function beep(ok){
  try{var C=beep.c||(beep.c=new (window.AudioContext||window.webkitAudioContext)());var o=C.createOscillator(),g=C.createGain();o.connect(g);g.connect(C.destination);o.frequency.value=ok?880:300;g.gain.value=.1;o.start();o.stop(C.currentTime+(ok?.09:.25));}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(ok?40:[80,60,80]);}catch(e2){}
}
function norm(s){return String(s||'').trim().toUpperCase().replace(/\s+/g,'');}
function render(){
  document.getElementById('count').textContent=items.length;
  var box=document.getElementById('list');box.textContent='';
  items.slice().reverse().forEach(function(s){
    var d=document.createElement('div');d.className='item';
    var t=document.createElement('span');t.textContent=s;
    var b=document.createElement('button');b.textContent='Sil';
    b.onclick=function(){items=items.filter(function(x){return x!==s;});save();render();};
    d.append(t,b);box.append(d);
  });
}
function add(code){
  var s=norm(code);if(!s)return;
  if(items.indexOf(s)>=0){say('Zaten listede: '+s,'warn');beep(false);return;}
  items.push(s);save();render();say('Okundu: '+s,'ok');beep(true);
  fr.classList.add('hit');setTimeout(function(){fr.classList.remove('hit');},400);
}
async function start(){
  if(stream)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say('Bu tarayıcıda kamera yok. Safari ya da Chrome ile aç.','warn');return;}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});}
  catch(e){say('Kamera izni verilmedi. Tarayıcı ayarlarından bu site için kamerayı aç.','warn');return;}
  try{var tr=stream.getVideoTracks()[0],cp=tr.getCapabilities?tr.getCapabilities():{};
    var adv=[];if(cp.focusMode&&cp.focusMode.indexOf('continuous')>=0)adv.push({focusMode:'continuous'});
    if(adv.length)await tr.applyConstraints({advanced:adv});}catch(eF){}
  v.srcObject=stream;try{await v.play();}catch(e2){}
  await applyZoom();
  say('Barkodu çerçevenin içine getir. Okunan seri otomatik listeye eklenir.');
  det=null;reader=null;
  if('BarcodeDetector' in window){try{det=new window.BarcodeDetector();}catch(e3){det=null;}}
  var useZbar=!det&&window.zbarWasm&&window.zbarWasm.scanImageData;
  if(!det&&!useZbar&&window.ZXing){reader=new window.ZXing.MultiFormatReader();}
  var cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});
  running=true;
  async function loop(){
    if(!running)return;
    try{
      if(v.videoWidth){
        var vw=v.videoWidth,vh=v.videoHeight,bb=document.getElementById('cam').getBoundingClientRect();
        var scl=Math.max(bb.width/vw,bb.height/vh);                         // object-fit:cover ölçeği
        var cw=Math.min(vw,Math.round(vw*.92*(bb.width/(vw*scl))/dz)),ch=Math.min(vh,Math.round(bb.height*.6/(scl*dz)));
        var cx=Math.round((vw-cw)/2),cy=Math.round((vh-ch)/2);
        var sc=Math.min(1,960/cw);cv.width=Math.round(cw*sc);cv.height=Math.round(ch*sc);
        ctx.drawImage(v,cx,cy,cw,ch,0,0,cv.width,cv.height);
        var code=null;
        if(det){var r=await det.detect(cv);if(r&&r.length&&r[0].rawValue)code=r[0].rawValue;}
        else if(useZbar){var sy=await window.zbarWasm.scanImageData(ctx.getImageData(0,0,cv.width,cv.height));if(sy&&sy.length)code=sy[0].decode();}
        else if(reader){try{var ls=new window.ZXing.HTMLCanvasElementLuminanceSource(cv);code=reader.decodeWithState(new window.ZXing.BinaryBitmap(new window.ZXing.HybridBinarizer(ls))).getText();}catch(e4){}}
        if(code){var now=Date.now();if(code!==last||now-lastAt>2500){last=code;add(code);}lastAt=now;}
      }
    }catch(e5){}
    setTimeout(loop,0);
  }
  loop();
}
function stop(){
  running=false;if(timer){clearInterval(timer);timer=null;}
  if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
  v.srcObject=null;say('Kamera durdu.');
}
document.getElementById('zin').onclick=function(){zoom=Math.min(6,Math.round((zoom+0.5)*10)/10);applyZoom();};
document.getElementById('zout').onclick=function(){zoom=Math.max(1,Math.round((zoom-0.5)*10)/10);applyZoom();};
document.getElementById('start').onclick=start;
if(window.matchMedia&&window.matchMedia('(orientation:portrait)').matches)say('İpucu: telefonu yan çevirirsen kamera görüşü genişler. Başlat\'a bas.');
document.getElementById('stop').onclick=stop;
document.getElementById('clear').onclick=function(){if(!items.length)return;if(window.confirm('Liste temizlensin mi?')){items=[];save();render();}};
document.getElementById('copy').onclick=async function(){
  var text=items.join('\n');if(!text){say('Liste boş.','warn');return;}
  try{await navigator.clipboard.writeText(text);say(items.length+' seri kopyalandı. ','ok');var l=document.createElement('a');l.href='https://claude.ai/artifact/N6tWSUBi5HRvY3oQAs6G8e#okut';l.textContent='Deftere dön ve yapıştır';msg.append(l);}
  catch(e){var ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();try{document.execCommand('copy');say(items.length+' seri kopyalandı.','ok');}catch(e2){say('Kopyalanamadı. Listeyi elle seç.','warn');}ta.remove();}
};
render();
})();
</script>
</body>
</html>
