<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seri Okuyucu</title>
<style>
:root{--bg:#101614;--surface:#18211e;--ink:#e6ece9;--muted:#9aa9a3;--line:#2c3a35;--accent:#3fb6a0;--ok:#62c88a;--warn:#e0b04a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:0 max(10px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(8px,env(safe-area-inset-top)) 0 6px;border-bottom:1px solid var(--line)}
.cam{position:relative;background:#000;border-radius:10px;overflow:hidden;max-width:560px;margin:0 auto;height:118px}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.frame{position:absolute;left:4%;right:4%;top:20%;bottom:20%;border:3px solid var(--accent);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.5);pointer-events:none}
.frame.hit{border-color:var(--ok)}
.row{display:flex;gap:6px;align-items:center;margin:6px auto 0;max-width:560px}
button,.btn{font:600 14px inherit;font-family:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 10px;border-radius:8px;flex:1 1 auto;text-align:center;text-decoration:none}
button.primary,.btn.primary{background:var(--accent);color:#06201b;border-color:var(--accent)}
button.on{background:var(--accent);color:#06201b;border-color:var(--accent)}
input[type=text]{font:16px inherit;font-family:inherit;width:100%;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
#msg{max-width:560px;margin:6px auto 0;padding:6px 10px;border-radius:8px;background:var(--surface);color:var(--muted);font-size:14px}
#msg.ok{color:var(--ok)}#msg.warn{color:var(--warn)}
.count{flex:0 0 auto;font-size:22px;font-weight:700;min-width:44px;text-align:center}
#zlab{flex:0 0 auto;color:var(--muted);font-size:13px;min-width:72px;text-align:center}
.list,.mailbox{max-width:560px;margin:0 auto}
.mailbox{scroll-margin-top:290px;padding-top:8px}
.item{padding:8px 0;border-bottom:1px solid var(--line)}
.item .s{font-family:ui-monospace,Menlo,monospace;font-size:15px;word-break:break-all}
.item .p{color:var(--muted);font-size:14px}
.item .p.warn{color:var(--warn)}
.item .r{display:flex;gap:6px;margin-top:6px}
.item .r button{flex:0 0 auto;padding:6px 10px}
textarea{width:100%;min-height:200px;font:13px ui-monospace,Menlo,monospace;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
@media (orientation:landscape){.cam,.row,#msg,.list,.mailbox{max-width:900px}.cam{height:108px}}
#msg a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div id="top">
<div class="cam" id="cam"><video id="v" playsinline muted></video><div class="frame" id="f"></div></div>
<div id="msg">Önce işlemi seç, sonra Başlat'a bas.</div>
<div class="row"><button id="mSok" class="on">Söküm</button><button id="mYeni">Yeni ürün</button></div>
<div class="row"><button class="primary" id="start">Başlat</button><button id="stop">Durdur</button><button id="zout">Zoom −</button><button id="zin">Zoom +</button><span id="zlab">2.0x</span></div>
<div class="row" id="sokRow"><input type="text" id="bulk" inputmode="numeric" placeholder="İş emri no (okunanlara otomatik)"><button id="applyAll">Hepsine uygula</button></div>
<div class="row"><span class="count" id="count">0</span><button class="primary" id="mailBtn">Taslak hazırla</button><button id="copy">Listeyi kopyala</button><button id="clear">Temizle</button></div>
</div>
<div class="list" id="list"></div>
<datalist id="urunList"></datalist>

var MAIL_TO=['celalaydiner@securitas.com.tr','alarmegeplanlama@securitas.com.tr'];
var KEY='okuyucu_v2',items=[],mode='sok',bulk='';

var v=document.getElementById('v'),fr=document.getElementById('f'),msg=document.getElementById('msg');
var zoom=2,hwZoom=false,dz=1,stream=null,running=false,last='',lastAt=0,det=null,reader=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify({items:items,mode:mode,bulk:bulk}));}catch(e){}}
function say(t,c){msg.textContent=t;msg.className=c||'';}
function beep(ok){
  try{var C=beep.c||(beep.c=new (window.AudioContext||window.webkitAudioContext)());var o=C.createOscillator(),g=C.createGain();o.connect(g);g.connect(C.destination);o.frequency.value=ok?880:300;g.gain.value=.1;o.start();o.stop(C.currentTime+(ok?.09:.25));}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(ok?40:[80,60,80]);}catch(e2){}
}
function norm(s){return String(s||'').trim().toUpperCase().replace(/\s+/g,'');}
function normSie(s){var d=String(s||'').replace(/\D/g,'');return d?('SIE-'+d.padStart(10,'0')):'';}
function woList(s){return String(s||'').split(/[\s,;]+/).map(normSie).filter(Boolean);}
// katalog: seri 7 haneli MK ile başlıyorsa ürün otomatik bulunur
function resolve(it){
  if(it.kod&&URUN[it.kod]){it.ad=URUN[it.kod];return;}
  var m=/^(\d{7})\d{4,}$/.exec(it.s);
  if(m&&URUN[m[1]]){it.kod=m[1];it.ad=URUN[m[1]];it.auto=1;}
}
function render(){
  document.getElementById('count').textContent=items.length;
  document.getElementById('sokRow').style.display=mode==='sok'?'flex':'none';
  document.getElementById('mailBtn').style.display=mode==='sok'?'':'none';
  document.getElementById('mSok').className=mode==='sok'?'on':'';
  document.getElementById('mYeni').className=mode==='yeni'?'on':'';
  var box=document.getElementById('list');box.textContent='';
  items.slice().reverse().forEach(function(it){
    var d=document.createElement('div');d.className='item';
    var s=document.createElement('div');s.className='s';s.textContent=it.s;
    var p=document.createElement('div');p.className='p'+(it.kod?'':' warn');
    p.textContent=it.kod?('MK '+it.kod+' · '+it.ad+(it.auto?' (seriden)':'')):'Ürün bulunamadı: aşağıdan ara ve seç';
    d.append(s,p);
    if(!it.kod){
      var pi=document.createElement('input');pi.type='text';pi.setAttribute('list','urunList');pi.placeholder='Ürün ara: kod ya da ad yaz';pi.style.marginTop='6px';
      pi.oninput=function(){var m=/^(\d{7}) · /.exec(pi.value);if(m&&URUN[m[1]]){it.kod=m[1];it.ad=URUN[m[1]];it.auto=0;save();render();}};
      d.append(pi);
    }
    var r=document.createElement('div');r.className='r';
    if(mode==='sok'){
      var w=document.createElement('input');w.type='text';w.inputMode='numeric';w.placeholder='İş emri no (birden çoksa virgülle)';w.value=it.wo||'';
      w.oninput=function(){it.wo=w.value;save();};r.append(w);
    }
    var b=document.createElement('button');b.textContent='Sil';
    b.onclick=function(){items=items.filter(function(x){return x!==it;});save();render();};
    r.append(b);d.append(r);box.append(d);
  });
}
function add(code){
  var s=norm(code);if(!s)return;
  if(items.some(function(x){return x.s===s;})){say('Zaten listede: '+s,'warn');beep(false);return;}
  var it={s:s,wo:mode==='sok'?bulk:''};resolve(it);items.push(it);save();render();
  say('Okundu: '+s+(it.kod?(' · '+it.ad):' · ürün seçilmeli'),it.kod?'ok':'warn');beep(true);
  fr.classList.add('hit');setTimeout(function(){fr.classList.remove('hit');},400);
}
async function applyZoom(){
  dz=1;hwZoom=false;
  var tr=stream&&stream.getVideoTracks()[0],cp={};
  try{cp=tr&&tr.getCapabilities?tr.getCapabilities():{};}catch(e){}
  if(cp.zoom&&cp.zoom.max){var z=Math.max(cp.zoom.min||1,Math.min(cp.zoom.max,zoom));try{await tr.applyConstraints({advanced:[{zoom:z}]});hwZoom=true;}catch(e2){hwZoom=false;}}
  if(!hwZoom){dz=zoom;}
  v.style.transform='scale('+dz+')';
  document.getElementById('zlab').textContent=zoom.toFixed(1)+'x'+(hwZoom?' (kamera)':(zoom>1?' (dijital)':''));
}
async function start(){
  if(stream)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say('Bu tarayıcıda kamera yok. Safari ya da Chrome ile aç.','warn');return;}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});}
  catch(e){say('Kamera izni verilmedi. Tarayıcı ayarlarından bu site için kamerayı aç.','warn');return;}
  try{var tr=stream.getVideoTracks()[0],cp=tr.getCapabilities?tr.getCapabilities():{};var adv=[];if(cp.focusMode&&cp.focusMode.indexOf('continuous')>=0)adv.push({focusMode:'continuous'});if(adv.length)await tr.applyConstraints({advanced:adv});}catch(eF){}
  v.srcObject=stream;try{await v.play();}catch(e2){}
  await applyZoom();
  say('Barkodu çerçevenin içine getir. Okunan seri otomatik listeye eklenir.');
  det=null;reader=null;
  if('BarcodeDetector' in window){try{det=new window.BarcodeDetector();}catch(e3){det=null;}}
  var useZbar=!det&&window.zbarWasm&&window.zbarWasm.scanImageData;
  if(!det&&!useZbar&&window.ZXing){reader=new window.ZXing.MultiFormatReader();}
  var cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});
  running=true;
  async function loop(){
    if(!running)return;
    try{
      if(v.videoWidth){
        var vw=v.videoWidth,vh=v.videoHeight,bb=document.getElementById('cam').getBoundingClientRect();
        var scl=Math.max(bb.width/vw,bb.height/vh);
        var cw=Math.min(vw,Math.round(.92*bb.width/(scl*dz))),ch=Math.min(vh,Math.round(bb.height*.6/(scl*dz)));
        var cx=Math.round((vw-cw)/2),cy=Math.round((vh-ch)/2);
        var sc=Math.min(1,960/cw);cv.width=Math.round(cw*sc);cv.height=Math.round(ch*sc);
        ctx.drawImage(v,cx,cy,cw,ch,0,0,cv.width,cv.height);
        var code=null;
        if(det){var r=await det.detect(cv);if(r&&r.length&&r[0].rawValue)code=r[0].rawValue;}
        else if(useZbar){var sy=await window.zbarWasm.scanImageData(ctx.getImageData(0,0,cv.width,cv.height));if(sy&&sy.length)code=sy[0].decode();}
        else if(reader){try{var ls=new window.ZXing.HTMLCanvasElementLuminanceSource(cv);code=reader.decodeWithState(new window.ZXing.BinaryBitmap(new window.ZXing.HybridBinarizer(ls))).getText();}catch(e4){}}
        if(code){var now=Date.now();if(code!==last||now-lastAt>2500){last=code;add(code);}lastAt=now;}
      }
    }catch(e5){}
    setTimeout(loop,0);
  }
  loop();
}
function stop(){running=false;if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}v.srcObject=null;say('Kamera durdu.');}
function mailText(){
  var lines=items.map(function(it,i){
    return (i+1)+') MK '+(it.kod||'(bilinmiyor)')+' - '+(it.ad||'(ürün adı bilinmiyor)')+' - Seri: '+it.s+(woList(it.wo).length?(' - İş emri: '+woList(it.wo).join(', ')):'');
  });
  return 'Merhaba,\n\naşağıdaki listede bulunan ürünler izmir depoya teslim edilmiştir.\n\n'+lines.join('\n')+'\n';
}
function gmailUrl(t){return 'https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(MAIL_TO.join(','))+'&body='+encodeURIComponent(t).replace(/%0A/g,'%0D%0A');}
function enc(t){return encodeURIComponent(t).replace(/%0A/g,'%0D%0A');}
function appUrl(t){return 'googlegmail:///co?to='+encodeURIComponent(MAIL_TO.join(','))+'&body='+enc(t);}
function mailtoUrl(t){return 'mailto:'+MAIL_TO.join(',')+'?body='+enc(t);}
function showMail(){
  if(!items.length){say('Listede ürün yok.','warn');return;}
  var eksik=items.filter(function(i){return !i.kod;}).length,noWo=items.filter(function(i){return !woList(i.wo).length;}).length;
  var t=mailText(),ua=navigator.userAgent||'',ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),android=/Android/.test(ua);
  var warn=(eksik?(' UYARI: '+eksik+' üründe ürün adı yok.'):'')+(noWo?(' '+noWo+' üründe iş emri yok.'):'');
  if(ios){
    say('Gmail uygulaması açılıyor: konuyu yaz ve gönder.'+warn,(eksik||noWo)?'warn':'ok');
    var l=document.createElement('a');l.href=mailtoUrl(t);l.textContent=' Açılmadıysa buraya dokun (Mail uygulaması).';msg.append(l);
    window.location.href=appUrl(t);return;
  }
  if(android){say('Mail uygulaması açılıyor: konuyu yaz ve gönder.'+warn,(eksik||noWo)?'warn':'ok');window.location.href=mailtoUrl(t);return;}
  var w=window.open(gmailUrl(t),'_blank');
  if(!w){say('Gmail açılamadı: tarayıcı açılır pencereyi engelledi. Bu site için izin ver.','warn');return;}
  say('Gmail taslağı açıldı: konuyu yaz ve gönder.'+warn,(eksik||noWo)?'warn':'ok');
}
var dl=document.getElementById('urunList');Object.keys(URUN).forEach(function(k){var o=document.createElement('option');o.value=k+' · '+URUN[k];dl.append(o);});
document.getElementById('bulk').value=bulk;
document.getElementById('bulk').oninput=function(){bulk=this.value;save();};

document.getElementById('copy').onclick=async function(){
  var text=items.map(function(x){return x.s;}).join('\n');if(!text){say('Liste boş.','warn');return;}
  try{await navigator.clipboard.writeText(text);say(items.length+' seri kopyalandı. ','ok');var l=document.createElement('a');l.href='https://claude.ai/artifact/N6tWSUBi5HRvY3oQAs6G8e#okut';l.textContent='Deftere dön ve yapıştır';msg.append(l);}
  catch(e){var ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();try{document.execCommand('copy');say(items.length+' seri kopyalandı.','ok');}catch(e2){say('Kopyalanamadı.','warn');}ta.remove();}
};
items.forEach(resolve);render();
